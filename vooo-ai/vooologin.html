<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vooo AI Education</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }
        .logo p {
            color: #666;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .links {
            text-align: center;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎓 Vooo AI</h1>
            <p>Login to Your Account</p>
        </div>
        
        <div id="error-message" class="error"></div>
        
        <form id="login-form" autocomplete="off">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="user_vooo_login" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" name="pass_vooo_login" autocomplete="off" readonly onfocus="this.removeAttribute('readonly'); this.type='password';" required>
            </div>
            
            <button type="submit" class="btn" id="login-btn">Login</button>
        </form>
        
        <div class="links">
            <a href="vooosignup.html">Don't have an account? Sign Up</a>
            <a href="voooreset.html">Forgot Password?</a>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="vooo-config.js"></script>
    
    <script>
        // Initialize Firebase
        firebase.initializeApp(VOOO_CONFIG.firebase);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');
        
        // Clear fields on load
        window.addEventListener('load', () => {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameOrEmail = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            errorDiv.style.display = 'none';
            
            try {
                let email = usernameOrEmail;
                
                // If not email format, find email from username
                if (!usernameOrEmail.includes('@')) {
                    const userQuery = await db.collection('users')
                        .where('username', '==', usernameOrEmail)
                        .limit(1)
                        .get();
                    
                    if (userQuery.empty) {
                        throw new Error('Username not found');
                    }
                    
                    email = userQuery.docs[0].data().email;
                }
                
                // Login with Firebase Auth
                await auth.signInWithEmailAndPassword(email, password);
                
                // Update last login
                const user = auth.currentUser;
                await db.collection('users').doc(user.uid).update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Redirect to dashboard
                window.location.href = 'vooodashboard.html';
                
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = 'Login failed. ';
                if (error.code === 'auth/wrong-password') {
                    errorMessage += 'Incorrect password.';
                } else if (error.code === 'auth/user-not-found' || error.message === 'Username not found') {
                    errorMessage += 'Username or email not found.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage += 'Invalid email format.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage += 'Too many failed attempts. Try again later.';
                } else {
                    errorMessage += error.message;
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
