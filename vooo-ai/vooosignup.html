<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Vooo AI Education</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0D47A1;
            min-height: 100vh;
            padding: 20px;
        }
        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 40px;
        }

        /* ====== TOP ROW: Go Back + Logo ====== */
        .top-row {
            position: relative;
            margin-bottom: 25px;
        }

        .go-back-btn {
            position: absolute;
            top: 0;
            left: 0;
            background: #0D47A1;
            color: #FFFFFF;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
            display: inline-block;
        }

        .go-back-btn:hover {
            background: #0a3a8a;
            color: #FFFFFF;
            text-decoration: none;
        }

        .logo {
            text-align: center;
            padding-top: 45px;
        }

        .logo h1 {
            color: #0D47A1;
            font-size: 2.8em;
            font-weight: 800;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .logo p {
            color: #2E7D32;
            font-size: 1.2em;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #0D47A1;
        }

        /* Password mismatch indicator */
        .password-match-msg {
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }
        .password-match-msg.match { color: #2E7D32; }
        .password-match-msg.no-match { color: #c33; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .logo h1 { font-size: 2em; white-space: normal; }
            .logo p { font-size: 1em; }
            .go-back-btn { font-size: 0.9em; padding: 6px 12px; }
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #0D47A1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #0a3a8a; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .error, .success {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #2E7D32; font-weight: 700; font-size: 1.1em; text-align: center; }

        .links {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
        .links a {
            color: #000000;
            text-decoration: none;
            font-weight: 700;
        }
        .links a:hover { text-decoration: underline; }

        small { color: #666; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="signup-container">

        <!-- Top row: Go Back button + Logo -->
        <div class="top-row">
            <a href="https://odelya.online/vooo-ai" class="go-back-btn">← Back</a>
            <div class="logo">
                <h1>🎓 Vooo AI Education</h1>
                <p>Guaranteed Unlimited Unique MCQs</p>
            </div>
        </div>

        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>

        <form id="signup-form" autocomplete="off">

            <div class="form-group">
                <label for="fullname">Full Name *</label>
                <input type="text" id="fullname" name="fullname_vooo" autocomplete="off" required maxlength="25" pattern="[A-Za-z ]{3,25}">
                <small>max 25 char</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="text" id="dob" name="dob_vooo" autocomplete="off" placeholder="DD-MM-YYYY" required pattern="\d{2}-\d{2}-\d{4}">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="text" id="phone" name="phone_vooo" autocomplete="off" placeholder="10 digit mobile number" required maxlength="10">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="text" id="email" name="email_vooo" autocomplete="off" readonly onfocus="this.removeAttribute('readonly'); this.type='email';" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username_vooo" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required minlength="8" maxlength="12" pattern="[a-zA-Z0-9]{8,12}">
                    <small>8-12 characters, uppercase, lowercase, letters and numbers</small>
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="text" id="password" name="password_vooo" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly'); this.type='password';" required minlength="8" maxlength="12">
                    <small>8-12 chars: uppercase, lowercase, number, special char</small>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm-password">Confirm Password *</label>
                <input type="password" id="confirm-password" name="confirm_password_vooo" autocomplete="off" required minlength="8" maxlength="12" placeholder="Re-enter your password">
                <div id="password-match-msg" class="password-match-msg"></div>
            </div>

            <div class="form-group">
                <label for="security-question">Security Question *</label>
                <select id="security-question" name="security_vooo" autocomplete="off" required>
                    <option value="">Select a question</option>
                    <option>In which city were you born?</option>
                    <option>What is your favourite subject?</option>
                    <option>Which color do you like most?</option>
                </select>
            </div>

            <div class="form-group">
                <label for="security-answer">Answer *</label>
                <input type="text" id="security-answer" name="answer_vooo" autocomplete="off" required minlength="2">
            </div>

            <button type="submit" class="btn" id="signup-btn">Sign Up Free</button>
        </form>

        <div class="links">
            Already have an account? <a href="vooologin.html">Login</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="vooo-config.js"></script>

    <script>
        // Initialize Firebase
        firebase.initializeApp(VOOO_CONFIG.firebase);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const form = document.getElementById('signup-form');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        const signupBtn = document.getElementById('signup-btn');

        // Clear all fields on page load
        window.addEventListener('load', () => {
            document.getElementById('fullname').value = '';
            document.getElementById('dob').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('email').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('confirm-password').value = '';
            document.getElementById('security-question').value = '';
            document.getElementById('security-answer').value = '';
        });

        // Format name to title case
        function toTitleCase(str) {
            return str.toLowerCase().split(' ').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        // Validate password
        function validatePassword(password) {
            const hasUpper   = /[A-Z]/.test(password);
            const hasLower   = /[a-z]/.test(password);
            const hasNumber  = /\d/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            return hasUpper && hasLower && hasNumber && hasSpecial;
        }

        // Validate phone
        function validatePhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        // ====== CONFIRM PASSWORD MATCH INDICATOR ======
        const passwordInput  = document.getElementById('password');
        const confirmInput   = document.getElementById('confirm-password');
        const matchMsg       = document.getElementById('password-match-msg');

        function checkPasswordMatch() {
            const p1 = passwordInput.value;
            const p2 = confirmInput.value;
            if (p2.length === 0) {
                matchMsg.style.display = 'none';
                return;
            }
            matchMsg.style.display = 'block';
            if (p1 === p2) {
                matchMsg.textContent = '✓ Passwords match';
                matchMsg.className = 'password-match-msg match';
            } else {
                matchMsg.textContent = '✗ Passwords do not match';
                matchMsg.className = 'password-match-msg no-match';
            }
        }

        confirmInput.addEventListener('input', checkPasswordMatch);
        passwordInput.addEventListener('input', checkPasswordMatch);

        // ====== FORM SUBMIT ======
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            let fullname       = document.getElementById('fullname').value.trim();
            const dob          = document.getElementById('dob').value.trim();
            const phone        = document.getElementById('phone').value.trim();
            const email        = document.getElementById('email').value.trim().toLowerCase();
            const username     = document.getElementById('username').value.trim();
            const password     = document.getElementById('password').value;
            const confirmPass  = document.getElementById('confirm-password').value;
            const securityQuestion = document.getElementById('security-question').value;
            const securityAnswer   = document.getElementById('security-answer').value.trim().toLowerCase();

            // Validate phone
            if (!validatePhone(phone)) {
                errorDiv.textContent = 'Phone must be exactly 10 digits';
                errorDiv.style.display = 'block';
                return;
            }

            // Validate passwords match
            if (password !== confirmPass) {
                errorDiv.textContent = 'Passwords do not match. Please re-enter.';
                errorDiv.style.display = 'block';
                return;
            }

            // Validate password strength
            if (!validatePassword(password)) {
                errorDiv.textContent = 'Password must include uppercase, lowercase, number, and special character';
                errorDiv.style.display = 'block';
                return;
            }

            // Format full name
            fullname = toTitleCase(fullname);

            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating account...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                // Check if username already exists
                const usernameCheck = await db.collection('users')
                    .where('username', '==', username)
                    .limit(1)
                    .get();

                if (!usernameCheck.empty) {
                    throw new Error('Username already taken. Please choose another.');
                }

                // Create auth user
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    username: username,
                    fullName: fullname,
                    dob: dob,
                    phone: phone,
                    email: email,
                    securityQuestion: securityQuestion,
                    securityAnswer: securityAnswer,
                    tier: 'free',
                    vooo_user: true,
                    planType: null,
                    planStartDate: null,
                    planExpiryDate: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    dailyStreak: 0,
                    totalMCQsAttempted: 0,
                    accuracyScore: 0,
                    badges: ['first_login'],
                    devices: [],
                    dailyUsage: {
                        date: new Date().toISOString().split('T')[0],
                        count: 0
                    }
                });

                // Show success message
                successDiv.textContent = '✓ Registration Successful! Redirecting...';
                successDiv.style.display = 'block';
                form.reset();

                // Redirect to vooo-ai page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'https://odelya.online/vooo-ai';
                }, 2000);

            } catch (error) {
                console.error('Signup error:', error);

                let errorMessage = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Email already registered. Please login or use another email.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Use at least 8 characters.';
                }

                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                signupBtn.disabled = false;
                signupBtn.textContent = 'Sign Up Free';
            }
        });

        // Phone: digits only, max 10
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
        });
        phoneInput.addEventListener('paste', (e) => {
            e.preventDefault();
            let pastedData = e.clipboardData.getData('text');
            phoneInput.value = pastedData.replace(/\D/g, '').slice(0, 10);
        });

        // DOB: auto format DD-MM-YYYY
        const dobInput = document.getElementById('dob');
        dobInput.addEventListener('input', (e) => {
            let numbers = e.target.value.replace(/\D/g, '').slice(0, 8);
            let formatted = '';
            if (numbers.length >= 1) formatted = numbers.slice(0, 2);
            if (numbers.length >= 3) formatted += '-' + numbers.slice(2, 4);
            if (numbers.length >= 5) formatted += '-' + numbers.slice(4, 8);
            e.target.value = formatted;
        });

        // Username: allow uppercase, lowercase, numbers only
        document.getElementById('username').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, '');
        });
    </script>
</body>
</html>
