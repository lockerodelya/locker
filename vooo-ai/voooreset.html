<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Vooo AI Education</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0D47A1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }

        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 1100px;
            padding: 40px 50px;
            margin: 0 auto;
        }

        .logo-img-wrapper {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #0D47A1;
            margin: 0 auto 12px auto;
        }

        .logo-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ====== LOGO / HEADER ====== */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #0D47A1;
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .logo p {
            color: #000000;
            font-size: 1.4em;
            font-weight: 700;
        }

        /* ====== FORM ====== */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0D47A1;
        }

        /* 2-column grid */
        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #0D47A1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.15em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 6px;
        }
        .btn:hover { background: #0a3a8a; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .error, .success {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #2E7D32; font-weight: 700; }

        /* ====== LINKS BAR ====== */
        .links-bar {
            background: #0D47A1;
            border-radius: 10px;
            padding: 14px 20px;
            margin-top: 22px;
            text-align: center;
        }
        .links-bar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 800;
        }
        .links-bar a:hover { text-decoration: underline; }

        /* ====== STEP VISIBILITY ====== */
        .step { display: none; }
        .step.active { display: block; }

        small { color: #666; font-size: 0.85em; display: block; margin-top: 3px; }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            body { padding: 0; }
            .reset-container {
                width: 100%;
                border-radius: 0;
                margin: 0;
                padding: 24px 18px;
            }
            .form-row-2 { grid-template-columns: 1fr; }
            .logo h1 { font-size: 1.7em; }
            .logo p { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="reset-container">

        <div class="logo">
            <div class="logo-img-wrapper">
                <img src="/vooo-ai/images/vooo-logo.jpg" alt="Vooo Logo">
            </div>
            <h1>Reset Password</h1>
            <p>Vooo AI Education</p>
        </div>

        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>

        <!-- Step 1: Verify Identity -->
        <div id="step1" class="step active">
            <form id="verify-form">

                <!-- Row 1: Username | DOB -->
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" required minlength="8" maxlength="12" placeholder="Your username">
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="text" id="dob" placeholder="DD-MM-YYYY" required pattern="\d{2}-\d{2}-\d{4}">
                        <small>Format: DD-MM-YYYY</small>
                    </div>
                </div>

                <!-- Row 2: Phone | Email -->
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="text" id="phone" placeholder="10 digit mobile number" required maxlength="10">
                    </div>
                    <div class="form-group">
                        <label for="email">Email ID *</label>
                        <input type="text" id="email" autocomplete="off" readonly onfocus="this.removeAttribute('readonly'); this.type='email';" required placeholder="your@email.com">
                    </div>
                </div>

                <button type="submit" class="btn" id="verify-btn">Verify Identity</button>
            </form>
        </div>

        <!-- Step 2: Reset Password -->
        <div id="step2" class="step">
            <form id="reset-form">
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="new-password">New Password *</label>
                        <input type="password" id="new-password" required minlength="8" maxlength="12" placeholder="New password">
                        <small>8–12 chars: uppercase, lowercase, number, special char</small>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password *</label>
                        <input type="password" id="confirm-password" required minlength="8" maxlength="12" placeholder="Re-enter new password">
                    </div>
                </div>
                <button type="submit" class="btn" id="reset-btn">Reset Password</button>
            </form>
        </div>

        <!-- Back to Login bar -->
        <div class="links-bar">
            <a href="vooologin.html">← Back to Login</a>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="vooo-config.js"></script>

    <script>
        // Initialize Firebase
        firebase.initializeApp(VOOO_CONFIG.firebase);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let verifiedUserEmail = null;

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');

        // Verify form
        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim().toLowerCase();
            const dob      = document.getElementById('dob').value.trim();
            const phone    = document.getElementById('phone').value.trim();
            const email    = document.getElementById('email').value.trim().toLowerCase();

            const verifyBtn = document.getElementById('verify-btn');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                // Find user by username
                const userQuery = await db.collection('users')
                    .where('username', '==', username)
                    .limit(1)
                    .get();

                if (userQuery.empty) {
                    throw new Error('Username not found.');
                }

                const userDoc  = userQuery.docs[0];
                const userData = userDoc.data();

                // Verify details match
                if (userData.dob !== dob) {
                    throw new Error('Date of birth does not match.');
                }

                if (userData.phone !== phone) {
                    throw new Error('Phone number does not match.');
                }

                if (userData.email !== email) {
                    throw new Error('Email ID does not match.');
                }

                // All verification passed
                verifiedUserEmail = userData.email;

                successDiv.textContent = '✓ Identity verified! Now set your new password.';
                successDiv.style.display = 'block';

                // Move to step 2
                setTimeout(() => {
                    step1.classList.remove('active');
                    step2.classList.add('active');
                    successDiv.style.display = 'none';
                }, 1500);

            } catch (error) {
                console.error('Verification error:', error);
                errorDiv.textContent = error.message || 'Verification failed. Please check your details.';
                errorDiv.style.display = 'block';
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Identity';
            }
        });

        // Reset password form
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword     = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!validatePassword(newPassword)) {
                errorDiv.textContent = 'Password must include uppercase, lowercase, number, and special character.';
                errorDiv.style.display = 'block';
                return;
            }

            const resetBtn = document.getElementById('reset-btn');
            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';
            errorDiv.style.display = 'none';

            try {
                // Send password reset email
                await auth.sendPasswordResetEmail(verifiedUserEmail);

                successDiv.textContent = '✓ Password reset email sent! Check your email and follow the link to complete reset.';
                successDiv.style.display = 'block';

                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'vooologin.html';
                }, 3000);

            } catch (error) {
                console.error('Reset error:', error);
                errorDiv.textContent = 'Unable to reset password. Please contact support at ' + VOOO_CONFIG.business.email;
                errorDiv.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });

        // Validate password
        function validatePassword(password) {
            const hasUpper   = /[A-Z]/.test(password);
            const hasLower   = /[a-z]/.test(password);
            const hasNumber  = /\d/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            return hasUpper && hasLower && hasNumber && hasSpecial;
        }

        // Phone: digits only, max 10
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
        });
        phoneInput.addEventListener('paste', (e) => {
            e.preventDefault();
            let pastedData = e.clipboardData.getData('text');
            phoneInput.value = pastedData.replace(/\D/g, '').slice(0, 10);
        });

        // Auto-format DOB
        document.getElementById('dob').addEventListener('input', (e) => {
            let numbers = e.target.value.replace(/\D/g, '').slice(0, 8);
            let formatted = '';
            if (numbers.length >= 1) formatted = numbers.slice(0, 2);
            if (numbers.length >= 3) formatted += '-' + numbers.slice(2, 4);
            if (numbers.length >= 5) formatted += '-' + numbers.slice(4, 8);
            e.target.value = formatted;
        });
    </script>
</body>
</html>
