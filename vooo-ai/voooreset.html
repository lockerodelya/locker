<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Vooo AI Education</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }
        .logo p {
            color: #666;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error, .success {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error {
            background: #fee;
            color: #c33;
        }
        .success {
            background: #efe;
            color: #3c3;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        small {
            color: #666;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <h1>Reset Password</h1>
            <p>Vooo AI Education</p>
        </div>
        
        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>
        
        <!-- Step 1: Verify Identity -->
        <div id="step1" class="step active">
            <form id="verify-form">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" required minlength="8" maxlength="12">
                </div>
                
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="text" id="dob" placeholder="DD-MM-YYYY" required pattern="\d{2}-\d{2}-\d{4}">
                    <small>Format: DD-MM-YYYY</small>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" placeholder="+91-XXXXXXXXXX" required pattern="\+91-\d{10}">
                </div>
                
                <div class="form-group">
                    <label for="security-question">Security Question *</label>
                    <select id="security-question" required>
                        <option value="">Select your security question</option>
                        <option>In which city were you born?</option>
                        <option>What is your favourite subject?</option>
                        <option>Which color do you like most?</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="security-answer">Security Answer *</label>
                    <input type="text" id="security-answer" required minlength="2">
                    <small>Answer is case-insensitive</small>
                </div>
                
                <button type="submit" class="btn" id="verify-btn">Verify Identity</button>
            </form>
        </div>
        
        <!-- Step 2: Reset Password -->
        <div id="step2" class="step">
            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">New Password *</label>
                    <input type="password" id="new-password" required minlength="8">
                    <small>Min 8 characters, include uppercase, lowercase, number, special character</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" required minlength="8">
                </div>
                
                <button type="submit" class="btn" id="reset-btn">Reset Password</button>
            </form>
        </div>
        
        <div class="links">
            <a href="vooologin.html">Back to Login</a>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="vooo-config.js"></script>
    
    <script>
        // Initialize Firebase
        firebase.initializeApp(VOOO_CONFIG.firebase);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let verifiedUserEmail = null;
        
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        
        // Verify form
        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const dob = document.getElementById('dob').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const securityQuestion = document.getElementById('security-question').value;
            const securityAnswer = document.getElementById('security-answer').value.trim().toLowerCase();
            
            const verifyBtn = document.getElementById('verify-btn');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            try {
                // Find user by username
                const userQuery = await db.collection('users')
                    .where('username', '==', username)
                    .limit(1)
                    .get();
                
                if (userQuery.empty) {
                    throw new Error('Username not found');
                }
                
                const userDoc = userQuery.docs[0];
                const userData = userDoc.data();
                
                // Verify all details match
                if (userData.dob !== dob) {
                    throw new Error('Date of birth does not match');
                }
                
                if (userData.phone !== phone) {
                    throw new Error('Phone number does not match');
                }
                
                if (userData.securityQuestion !== securityQuestion) {
                    throw new Error('Security question does not match');
                }
                
                if (userData.securityAnswer !== securityAnswer) {
                    throw new Error('Security answer does not match');
                }
                
                // All verification passed
                verifiedUserEmail = userData.email;
                
                successDiv.textContent = '✓ Identity verified! Now set your new password.';
                successDiv.style.display = 'block';
                
                // Move to step 2
                setTimeout(() => {
                    step1.classList.remove('active');
                    step2.classList.add('active');
                    successDiv.style.display = 'none';
                }, 1500);
                
            } catch (error) {
                console.error('Verification error:', error);
                errorDiv.textContent = error.message || 'Verification failed. Please check your details.';
                errorDiv.style.display = 'block';
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Identity';
            }
        });
        
        // Reset password form
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validate password
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (!validatePassword(newPassword)) {
                errorDiv.textContent = 'Password must include uppercase, lowercase, number, and special character';
                errorDiv.style.display = 'block';
                return;
            }
            
            const resetBtn = document.getElementById('reset-btn');
            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';
            errorDiv.style.display = 'none';
            
            try {
                // Send password reset email
                await auth.sendPasswordResetEmail(verifiedUserEmail);
                
                successDiv.textContent = '✓ Password reset email sent! Check your email and follow the link to complete reset.';
                successDiv.style.display = 'block';
                
                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'vooologin.html';
                }, 3000);
                
            } catch (error) {
                console.error('Reset error:', error);
                
                // If email verification fails, try alternative method
                // (Note: Firebase requires email verification for security)
                errorDiv.textContent = 'Unable to reset password. Please contact support at ' + VOOO_CONFIG.business.email;
                errorDiv.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
        
        // Validate password
        function validatePassword(password) {
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /\d/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            
            return hasUpper && hasLower && hasNumber && hasSpecial;
        }
        
        // Auto-format phone number
        document.getElementById('phone').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 10) value = value.slice(0, 10);
            if (value) {
                e.target.value = '+91-' + value;
            }
        });
        
        // Auto-format DOB
        document.getElementById('dob').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.slice(0, 2) + '-' + value.slice(2);
            }
            if (value.length >= 5) {
                value = value.slice(0, 5) + '-' + value.slice(5, 9);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
