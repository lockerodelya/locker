<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Vooo AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .admin-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #1e40af;
            font-size: 2em;
            margin-bottom: 5px;
        }
        .logo p {
            color: #666;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #1e40af;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #1e3a8a;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .info {
            background: #eff6ff;
            border: 2px solid #2563eb;
            color: #1e40af;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="logo">
            <h1>🔐 Admin Access</h1>
            <p>Vooo AI Education</p>
        </div>
        
        <div class="info">
            ℹ️ <strong>Default Password:</strong> Swamiji@1863#
        </div>
        
        <div id="error-message" class="error"></div>
        
        <form id="admin-form">
            <div class="form-group">
                <label for="admin-password">Admin Password</label>
                <input type="password" id="admin-password" required>
            </div>
            
            <button type="submit" class="btn">Access Admin Panel</button>
        </form>
    </div>
    
    <script>
        // ⭐ ADMIN PASSWORD
        const ADMIN_PASSWORD = 'Swamiji@1863#';
        
        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('admin-password').value;
            const errorDiv = document.getElementById('error-message');
            
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('vooo_admin_auth', 'true');
                window.location.href = 'voooadmin-users.html';
            } else {
                errorDiv.textContent = 'Access denied. Incorrect password.';
                errorDiv.style.display = 'block';
            }
        });
        
        // Already logged in?
        if (sessionStorage.getItem('vooo_admin_auth') === 'true') {
            window.location.href = 'voooadmin-users.html';
        }
    </script>
</body>
</html>
