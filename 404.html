<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages 404 handler for clean URLs
        (function() {
            var path = window.location.pathname;
            var hash = window.location.hash;
            
            // If path doesn't end with .html and isn't root, try to load the .html file
            if (path !== '/' && !path.endsWith('.html')) {
                // Redirect to the same path with .html extension
                window.location.replace(path + '.html' + hash);
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
